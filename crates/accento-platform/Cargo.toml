[package]
name = "accento-platform"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
accento-core = {path = "../accento-core"}
serde = {version = "1", features = ["derive"]}
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
x11 = {version = "2.21", features = ["xlib", "xinput", "xtest"]}
xkeysym = "0.2"
x11rb = "0.13"
enigo = {version = "0.6.1", default-features = false, features = ["x11rb"]}
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = {version = "0.62.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"]}
