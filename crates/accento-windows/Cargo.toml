[package]
name = "accento-windows"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "Accento"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", features = [] }
accento-core = { path = "../accento-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-numerics = "0.3.1"
windows = { version = "0.62.2", features = [
  "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi",
  "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite",
  "Win32_Graphics_Dxgi_Common", "Win32_System_Com", "Win32_System_LibraryLoader",
  "Win32_System_Threading", "Win32_System_Registry", "Win32_UI_Accessibility",
  "Win32_Storage_FileSystem",
  "Win32_Storage_Xps",
  "Win32_Security",
  "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Input_Ime", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
